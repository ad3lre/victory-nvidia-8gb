[package]
name = "victory"
description = "Command-line front end: inspect, census, convert, run."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
victory-core.workspace = true
victory-pe.workspace = true
victory-loader.workspace = true
victory-hle.workspace = true
victory-shader = { workspace = true, features = ["host"] }
victory-game.workspace = true
victory-telemetry.workspace = true
anyhow.workspace = true
blake3.workspace = true
memchr.workspace = true
clap.workspace = true
tracing.workspace = true
walkdir.workspace = true

[build-dependencies]
sha2 = "0.10.9"
ureq = "2.12.1"
zip = { version = "2.2.3", default-features = false, features = ["deflate"] }

[features]
# Full debug mode is the default: debug-layer / DRED naming on device-removed,
# frame capture, stack dumps, scripted keys. Opt out with --no-default-features.
default = ["diagnostics"]
diagnostics = [
    "victory-core/diagnostics",
    "victory-hle/diagnostics",
    "victory-loader/diagnostics",
    "victory-shader/diagnostics",
]

[lints]
workspace = true
